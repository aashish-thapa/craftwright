# craftwright — a pre-commit config that turns the discipline into a gate.
# Copy the stanzas you want into your project's .pre-commit-config.yaml, then
# `pre-commit install`. This is craftwright's moat over reminder-only rulesets:
# the bad patterns fail the commit instead of relying on the model to catch them.
#
# All revs verified from the source repos on 2026-07-01. Re-check before adopting —
# ruff, gitleaks, and promptfoo move fast (§Verify external-tool config from source).

repos:
  # §Never-in-production tripwires (assert-as-validation, bare except, print,
  # pickle/eval, shell=True, naive datetime, blocking async, ...). Config lives
  # in your pyproject.toml — see configs/pyproject.ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Hardcoded secrets. Purpose-built staged-diff scan, no baseline file needed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # §DIP / §Separation of Concerns — dependency direction. import-linter ships no
  # pre-commit repo, so run its CLI as a local hook. Contracts: configs/importlinter.example.toml
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (dependency direction)
        entry: lint-imports
        language: python
        additional_dependencies: ["import-linter==2.12"]
        pass_filenames: false
        types: [python]

  # Shell craftwright (and you) ship. §Never-in-production applies to bash too.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

# Opt-in extras:
#
#   bandit 1.9.4 — only adds B613/B614/B615 (Trojan-source, torch.load,
#   huggingface unsafe download) over ruff's S family. Worth it for ML repos:
#     - repo: https://github.com/PyCQA/bandit
#       rev: 1.9.4
#       hooks: [{id: bandit, args: ["-c", "pyproject.toml"]}]
#
#   detect-secrets v1.5.0 — prefer over gitleaks when you need a .secrets.baseline
#   grandfathering workflow on a brownfield repo.
